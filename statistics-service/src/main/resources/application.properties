spring.application.name=statistics-service

server.port=8081

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/statistics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:statistics_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:statistics_password}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# Main Inventory API
inventory.api.base-url=${INVENTORY_API_URL:http://localhost:8080}
inventory.api.username=${INVENTORY_API_USERNAME:admin}
inventory.api.password=${INVENTORY_API_PASSWORD:}

# Daily statistics collection
statistics.collection.cron=0 0 2 * * *
statistics.collection.zone=UTC

# Prometheus metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Resilience4j Retry
resilience4j.retry.instances.inventoryApi.max-attempts=3
resilience4j.retry.instances.inventoryApi.wait-duration=1s
resilience4j.retry.instances.inventoryApi.enable-exponential-backoff=true
resilience4j.retry.instances.inventoryApi.exponential-backoff-multiplier=2
# Don`t retry for clients error HTTP (4xx)
resilience4j.retry.instances.inventoryApi.ignore-exceptions=org.springframework.web.client.HttpClientErrorException