spring.application.name=inventory-api

# postgre
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username =inventory_user
spring.datasource.password=inventory_password
spring.datasource.driver-class-name=org.postgresql.Driver

# hibernate jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=bAgdt3VwZXItc2VjcmV0LWtleS1mb3ItaW52ZW50b3J5LWFwaS0yMDI2IQ==
jwt.expiration=86400000

# Initial users configuration
app.bootstrap.admin.username=${ADMIN_USERNAME:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.viewer.username=${VIEWER_USERNAME:}
app.bootstrap.viewer.password=${VIEWER_PASSWORD:}
